name = "ali-sodeyfi-site-admin"
main = "admin-api.js"
compatibility_date = "2026-08-13"

[vars]
ALLOWED_ORIGIN = "https://ali-sodeyfi.github.io"
GITHUB_OWNER = "ali-sodeyfi"
GITHUB_REPO = "ali-sodeyfi.github.io"
GITHUB_BRANCH = "main"
CONTENT_PATH = "content-overrides.json"
KAVENEGAR_TEMPLATE = "LoginOtp"

[[kv_namespaces]]
binding = "ADMIN_AUTH"
id = "replace-with-cloudflare-kv-namespace-id"

[triggers]
crons = ["*/5 * * * *"]
